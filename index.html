<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Duck Duck Nuke by Wulfzx.Underground</title>
  <style>
    :root {
      color-scheme: dark;
      --screen: #9cff6d;
      --screen-soft: rgba(156, 255, 109, 0.22);
      --amber: #ffc857;
      --danger: #ff5d4d;
      --metal: #1d2620;
      --panel: #0b130d;
      --panel-2: #101c13;
      --ink: #d9ffd0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 36%, rgba(255, 255, 255, 0.92), rgba(215, 215, 215, 0.78) 44%, #060806 100%),
        #111;
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: var(--app-height, 100dvh);
      display: grid;
      place-items: center;
      padding: 0;
      overflow: hidden;
    }

    .shell {
      position: relative;
      width: 100vw;
      height: var(--app-height, 100dvh);
      max-width: none;
      aspect-ratio: auto;
      background: #050605;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      filter: none;
    }

    .game-frame {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      padding: 0;
    }

    .screen-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      background: #061008;
      box-shadow:
        inset 0 0 18px rgba(156, 255, 109, 0.18),
        inset 0 0 90px rgba(0, 0, 0, 0.58);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: auto;
      cursor: crosshair;
      touch-action: none;
    }

    .scanlines {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.035) 0,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px,
          transparent 4px
        );
      mix-blend-mode: screen;
      opacity: 0.5;
    }

    .vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.65);
    }

    .side-panel {
      display: none !important;
      border: 2px solid #4f6640;
      border-radius: 8px;
      padding: 14px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.06), transparent 24%),
        var(--panel);
      box-shadow:
        inset 0 0 0 3px #1a2819,
        0 24px 60px rgba(0, 0, 0, 0.32);
      flex-direction: column;
      gap: 12px;
    }

    .brand {
      border: 1px solid rgba(156, 255, 109, 0.28);
      border-radius: 6px;
      padding: 12px;
      background: rgba(156, 255, 109, 0.05);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.05;
      color: var(--screen);
      text-shadow: 0 0 16px rgba(156, 255, 109, 0.5);
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 8px;
      color: rgba(217, 255, 208, 0.72);
      font-size: 13px;
      line-height: 1.35;
    }

    .meter {
      border: 1px solid rgba(156, 255, 109, 0.24);
      border-radius: 6px;
      background: var(--panel-2);
      padding: 10px;
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: rgba(217, 255, 208, 0.74);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .bar {
      position: relative;
      height: 34px;
      overflow: visible;
      background: url("assets/core-charger-bar.png") center / 100% 100% no-repeat;
    }

    .bar > span {
      position: absolute;
      left: 9.5%;
      top: 31%;
      display: block;
      height: 28%;
      width: 76%;
      transform-origin: left center;
      background: linear-gradient(90deg, var(--danger), var(--amber), var(--screen));
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(156, 255, 109, 0.28);
      opacity: 0.82;
      transition: transform 120ms linear;
    }

    .controls {
      display: grid;
      gap: 8px;
      margin-top: auto;
    }

    button {
      min-height: 44px;
      border: 1px solid rgba(156, 255, 109, 0.36);
      border-radius: 6px;
      background: rgba(156, 255, 109, 0.08);
      color: var(--screen);
      font: 700 14px/1 "Courier New", Courier, monospace;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: inset 0 0 18px rgba(156, 255, 109, 0.06);
    }

    button:hover,
    button:focus-visible {
      outline: none;
      background: rgba(156, 255, 109, 0.16);
      box-shadow: 0 0 0 3px rgba(156, 255, 109, 0.15), inset 0 0 18px rgba(156, 255, 109, 0.08);
    }

    .readout {
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: rgba(217, 255, 208, 0.76);
    }

    .readout strong {
      color: var(--screen);
      font-weight: 700;
    }

    .mobile-actions {
      display: none;
    }

    .mobile-cabinet-hud {
      display: none;
    }

    .rotate-device-overlay {
      display: none;
    }

    @media (max-width: 820px) {
      body {
        padding: 0;
        overflow: hidden;
      }

      .shell {
        width: 100vw;
      }

      .game-frame {
        min-height: 0;
      }

      .screen-wrap {
        min-height: auto;
      }

      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px), (max-height: 520px), (hover: none) and (pointer: coarse) {
      body {
        height: 100vh;
        height: 100dvh;
        height: var(--app-height, 100dvh);
        padding: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 22%, rgba(126, 91, 56, 0.44), rgba(6, 6, 5, 0.94) 64%),
          #050605;
      }

      .shell {
        width: 100vw;
        height: var(--app-height, 100dvh);
        max-width: none;
        aspect-ratio: auto;
        background: #050605;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        filter: none;
      }

      .game-frame {
        left: 0;
        top: 0;
        right: auto;
        bottom: auto;
        width: 100%;
        height: 100%;
        min-height: 0;
        z-index: 1;
      }

      .screen-wrap {
        border: 0;
        border-radius: 0;
        background: #13100b;
        box-shadow:
          inset 0 0 55px rgba(0, 0, 0, 0.35);
      }

      .scanlines {
        display: none;
      }

      .vignette {
        box-shadow: inset 0 0 48px rgba(0, 0, 0, 0.42);
      }

      .mobile-cabinet-hud {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: block;
        pointer-events: none;
        font-family: "Courier New", Courier, monospace;
      }

      .mobile-panel {
        position: absolute;
        display: grid;
        place-items: center;
        min-width: 0;
        color: var(--screen);
        text-align: center;
        text-transform: uppercase;
        background:
          linear-gradient(180deg, rgba(65, 42, 24, 0.96), rgba(15, 13, 10, 0.98)),
          #17120c;
        border: 2px solid #6d4f2b;
        border-radius: 7px;
        box-shadow:
          inset 0 0 0 2px rgba(0, 0, 0, 0.72),
          inset 0 -7px 0 rgba(0, 0, 0, 0.28),
          0 3px 0 rgba(0, 0, 0, 0.55);
        text-shadow: 0 0 8px rgba(156, 255, 109, 0.45);
      }

      .mobile-panel::after,
      .mobile-actions button::after,
      .pip-nav button::after {
        content: "";
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 5px;
        height: 8px;
        background: repeating-linear-gradient(135deg, #ddb143 0 8px, #1a1710 8px 16px);
        opacity: 0.86;
        border-radius: 2px;
      }

      .mobile-score {
        left: 4.2%;
        top: max(8px, env(safe-area-inset-top));
        width: 22%;
        height: 9.6%;
      }

      .mobile-best {
        right: 4.2%;
        top: max(8px, env(safe-area-inset-top));
        width: 22%;
        height: 9.6%;
      }

      .mobile-distance {
        left: 31%;
        bottom: 1.7%;
        width: 38%;
        height: 5.8%;
        font-size: clamp(18px, 5vw, 28px);
        letter-spacing: 0;
      }

      .mobile-panel-label {
        display: block;
        font-weight: 700;
        font-size: clamp(11px, 3vw, 17px);
        line-height: 1;
      }

      .mobile-panel-value {
        display: block;
        margin-top: 3px;
        color: #b7ff81;
        font-weight: 700;
        font-size: clamp(19px, 5.6vw, 32px);
        line-height: 1;
      }

      .mobile-charge {
        position: absolute;
        left: 28%;
        top: max(6px, env(safe-area-inset-top));
        width: 44%;
        height: 13.4%;
        color: var(--screen);
        text-align: center;
        text-transform: uppercase;
        background:
          linear-gradient(180deg, rgba(70, 46, 26, 0.96), rgba(16, 13, 9, 0.98)),
          #17120c;
        border: 2px solid #6d4f2b;
        border-radius: 7px;
        box-shadow:
          inset 0 0 0 2px rgba(0, 0, 0, 0.72),
          0 3px 0 rgba(0, 0, 0, 0.55);
      }

      .mobile-charge-title {
        position: absolute;
        left: 12%;
        right: 12%;
        top: 6%;
        padding: 1px 3px;
        background: rgba(0, 0, 0, 0.52);
        border-radius: 4px;
        font-weight: 700;
        font-size: clamp(9px, 2.55vw, 14px);
        line-height: 1.1;
      }

      .mobile-charge-track {
        position: absolute;
        left: 7%;
        right: 7%;
        top: 34%;
        height: 23%;
        border: 2px solid #0b0a08;
        border-radius: 3px;
        overflow: hidden;
        background: #160e0b;
      }

      .mobile-charge-fill {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: linear-gradient(90deg, #ff5d4d, #ffc857 42%, #9cff6d);
        box-shadow: 0 0 12px rgba(156, 255, 109, 0.52);
      }

      .mobile-charge-meta {
        position: absolute;
        left: 9%;
        right: 9%;
        bottom: 7%;
        display: grid;
        gap: 1px;
        place-items: center;
        color: #ffc857;
        font-weight: 700;
        font-size: clamp(9px, 2.55vw, 13px);
        line-height: 0.98;
        text-shadow: 0 0 8px rgba(255, 200, 87, 0.35);
      }

      .mobile-actions {
        position: absolute;
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        z-index: 5;
        display: grid;
        grid-template-columns: 1fr 1.85fr 1fr;
        gap: 8px;
        pointer-events: auto;
      }

      .mobile-actions button {
        position: relative;
        min-height: clamp(46px, 8.2vh, 64px);
        border: 2px solid #6d4f2b;
        border-radius: 7px;
        background:
          linear-gradient(180deg, rgba(66, 43, 25, 0.94), rgba(15, 13, 10, 0.98)),
          #17120c;
        color: #9cff6d;
        box-shadow:
          inset 0 0 0 2px rgba(0, 0, 0, 0.72),
          0 3px 0 rgba(0, 0, 0, 0.55);
        touch-action: manipulation;
      }

      .mobile-actions .boost-button {
        font-size: clamp(16px, 5vw, 22px);
        background:
          linear-gradient(180deg, rgba(88, 55, 25, 0.96), rgba(18, 15, 10, 0.98)),
          #21140c;
      }

      .sound-button {
        top: auto;
        right: max(12px, env(safe-area-inset-right));
        bottom: calc(max(10px, env(safe-area-inset-bottom)) + 68px);
        z-index: 7;
        min-height: 24px;
        padding: 0 8px;
        border-color: #6d4f2b;
        background: rgba(15, 13, 10, 0.92);
        font-size: clamp(9px, 2.6vw, 12px);
      }
    }

    .sound-button {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      top: max(12px, env(safe-area-inset-top));
      z-index: 6;
      min-height: 38px;
      padding: 0 12px;
      background: rgba(5, 12, 6, 0.82);
      backdrop-filter: blur(8px);
      font-size: 12px;
      touch-action: manipulation;
    }

    .pip-nav {
      position: absolute;
      left: 84%;
      top: 17.6%;
      z-index: 4;
      display: none;
      width: 6.5%;
      height: 13.2%;
      pointer-events: auto;
    }

    .pip-nav button {
      position: absolute;
      left: 0;
      width: 100%;
      height: 18%;
      min-height: 0;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: transparent;
      box-shadow: none;
      touch-action: manipulation;
    }

    .pip-stat {
      top: 0;
    }

    .pip-data {
      top: 43%;
    }

    .pip-radio {
      top: 86%;
    }

    .pip-nav button:hover,
    .pip-nav button:focus-visible {
      outline: 1px solid rgba(156, 255, 109, 0.68);
      background: rgba(156, 255, 109, 0.12);
    }

    @media (max-width: 820px), (max-height: 520px), (hover: none) and (pointer: coarse) {
      .pip-nav {
        left: auto;
        right: 2.8%;
        top: 14.8%;
        z-index: 6;
        display: grid;
        width: 19.5%;
        height: auto;
        gap: 8px;
      }

      .pip-nav button {
        position: relative;
        width: auto;
        height: auto;
        min-height: clamp(44px, 7vh, 62px);
        border: 2px solid #6d4f2b;
        border-radius: 7px;
        background:
          linear-gradient(180deg, rgba(66, 43, 25, 0.94), rgba(15, 13, 10, 0.98)),
          #17120c;
        color: var(--screen);
        font-size: clamp(12px, 3.5vw, 17px);
        text-shadow: 0 0 8px rgba(156, 255, 109, 0.52);
        box-shadow:
          inset 0 0 0 2px rgba(0, 0, 0, 0.72),
          0 3px 0 rgba(0, 0, 0, 0.55);
      }

      .pip-nav .pip-stat,
      .pip-nav .pip-data {
        display: none;
        pointer-events: none;
      }

      .pip-nav .pip-radio {
        top: auto;
      }

      body[data-phase="intro"] .pip-nav,
      body[data-phase="mode"] .pip-nav,
      body[data-phase="select"] .pip-nav,
      body[data-phase="scoreboard"] .pip-nav,
      body[data-phase="over"] .pip-nav {
        display: none;
      }

      body[data-phase="scoreboard"] .sound-button,
      body[data-phase="over"] .sound-button {
        display: none;
      }

      .sound-button {
        top: auto;
        right: max(12px, env(safe-area-inset-right));
        bottom: calc(max(10px, env(safe-area-inset-bottom)) + 68px);
        width: auto;
        height: auto;
        min-height: 24px;
        padding: 0 8px;
        border-color: #6d4f2b;
        background: rgba(15, 13, 10, 0.92);
        font-size: clamp(9px, 2.6vw, 12px);
      }
    }

    @media (max-width: 1024px) and (orientation: landscape) {
      .mobile-cabinet-hud,
      .mobile-actions,
      .pip-nav,
      .sound-button {
        display: none !important;
      }

      .rotate-device-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding:
          max(18px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(18px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
        pointer-events: auto;
        background:
          radial-gradient(circle at 50% 35%, rgba(156, 255, 109, 0.12), rgba(0, 0, 0, 0) 35%),
          linear-gradient(180deg, rgba(21, 16, 11, 0.96), rgba(4, 5, 4, 0.98));
        color: var(--screen);
        text-align: center;
        text-transform: uppercase;
      }

      .rotate-device-card {
        width: min(520px, 86vw);
        padding: 28px 22px;
        border: 2px solid #6d4f2b;
        border-radius: 10px;
        background:
          linear-gradient(180deg, rgba(66, 43, 25, 0.95), rgba(15, 13, 10, 0.98)),
          #17120c;
        box-shadow:
          inset 0 0 0 2px rgba(0, 0, 0, 0.72),
          0 18px 40px rgba(0, 0, 0, 0.5);
      }

      .rotate-device-title {
        display: block;
        font-size: clamp(24px, 7vw, 42px);
        font-weight: 700;
        line-height: 1;
        text-shadow: 0 0 12px rgba(156, 255, 109, 0.5);
      }

      .rotate-device-copy {
        display: block;
        margin-top: 12px;
        color: #ffc857;
        font-size: clamp(14px, 3.8vw, 20px);
        font-weight: 700;
        line-height: 1.2;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="Duck Duck Nuke game">
    <section class="game-frame">
      <div class="screen-wrap">
        <canvas id="game" width="960" height="640" aria-label="Playable jetpack side-scroller"></canvas>
        <div class="scanlines"></div>
        <div class="vignette"></div>
      </div>
    </section>

    <div class="mobile-cabinet-hud" aria-hidden="true">
      <div class="mobile-panel mobile-score">
        <span>
          <span class="mobile-panel-label">Score</span>
          <span id="mobileScoreText" class="mobile-panel-value">0</span>
        </span>
      </div>
      <div class="mobile-charge">
        <div class="mobile-charge-title">Core Charge</div>
        <div class="mobile-charge-track"><span id="mobileChargeBar" class="mobile-charge-fill"></span></div>
        <div class="mobile-charge-meta">
          <span id="mobileChargeText">100%</span>
          <span id="mobileCapsText">Caps 0/3</span>
        </div>
      </div>
      <div class="mobile-panel mobile-best">
        <span>
          <span class="mobile-panel-label">Best</span>
          <span id="mobileBestText" class="mobile-panel-value">0</span>
        </span>
      </div>
      <div class="mobile-panel mobile-distance">
        <span id="mobileDistanceText">0</span>
      </div>
    </div>

    <nav class="pip-nav" aria-label="Pip-Boy quick controls">
      <button id="statControl" class="pip-stat" type="button" title="Start">Start</button>
      <button id="dataControl" class="pip-data" type="button" title="Pause or resume">Pause</button>
      <button id="radioControl" class="pip-radio" type="button" title="Home">Home</button>
    </nav>

    <aside class="side-panel" aria-label="Game controls and status">
      <div class="brand">
        <h1>DUCK DUCK<br>NUKE</h1>
        <div class="subtitle">by Wulfzx.Underground. Thread the ruins, boost through the wasteland, grab WZX caps, and survive the barrels.</div>
      </div>

      <div class="meter">
        <div class="meter-label"><span>Core Charge</span><span id="chargeText">100%</span></div>
        <div class="bar"><span id="chargeBar"></span></div>
        <div class="meter-label"><span>Caps</span><span id="capsText">0/3</span></div>
      </div>

      <div class="readout">
        <div>Mode: <strong id="modeText">Ready</strong></div>
        <div>Score: <strong id="scoreText">0</strong></div>
        <div>Best: <strong id="bestText">0</strong></div>
        <div>Controls: <strong>Space / Click / Tap</strong></div>
        <div>Pause: <strong>P</strong></div>
      </div>

      <div class="controls">
        <button id="startButton" type="button">Start</button>
        <button id="pauseButton" type="button">Pause</button>
      </div>
    </aside>

    <div class="mobile-actions" aria-label="Mobile game controls">
      <button id="mobileRestartButton" type="button">Start</button>
      <button id="mobileBoostButton" class="boost-button" type="button">Boost</button>
      <button id="mobilePauseButton" type="button">Pause</button>
    </div>

    <button id="soundButton" class="sound-button" type="button" aria-pressed="true">Sound On</button>
  </main>

  <div class="rotate-device-overlay" role="status" aria-live="polite">
    <div class="rotate-device-card">
      <span class="rotate-device-title">Rotate Device</span>
      <span class="rotate-device-copy">Play in portrait</span>
    </div>
  </div>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const chargeBar = document.querySelector("#chargeBar");
    const chargeText = document.querySelector("#chargeText");
    const capsText = document.querySelector("#capsText");
    const modeText = document.querySelector("#modeText");
    const scoreText = document.querySelector("#scoreText");
    const bestText = document.querySelector("#bestText");
    const startButton = document.querySelector("#startButton");
    const pauseButton = document.querySelector("#pauseButton");
    const mobileRestartButton = document.querySelector("#mobileRestartButton");
    const mobileBoostButton = document.querySelector("#mobileBoostButton");
    const mobilePauseButton = document.querySelector("#mobilePauseButton");
    const mobileScoreText = document.querySelector("#mobileScoreText");
    const mobileBestText = document.querySelector("#mobileBestText");
    const mobileChargeText = document.querySelector("#mobileChargeText");
    const mobileChargeBar = document.querySelector("#mobileChargeBar");
    const mobileCapsText = document.querySelector("#mobileCapsText");
    const mobileDistanceText = document.querySelector("#mobileDistanceText");
    const soundButton = document.querySelector("#soundButton");
    const statControl = document.querySelector("#statControl");
    const dataControl = document.querySelector("#dataControl");
    const radioControl = document.querySelector("#radioControl");
    const playerSprite = new Image();
    playerSprite.src = "assets/pip-boy-rocket.png";
    const duckySprite = new Image();
    duckySprite.src = "assets/ducky.png";
    const amySprite = new Image();
    amySprite.src = "assets/amy-nuka-nightmare.png";
    const mayraSprite = new Image();
    mayraSprite.src = "assets/mayra-del-yermo.png";
    const coffeeSprite = new Image();
    coffeeSprite.src = "assets/coffee.png";
    const mm777Sprite = new Image();

    function scoreboardEntriesFromSnapshot(snapshot) {
      const byInitials = new Map();
      for (const doc of snapshot.docs) {
        const data = doc.data();
        const initials = cleanInitials(data.initials || doc.id || "???") || "???";
        const score = Math.max(0, Math.floor(Number(data.score) || 0));
        const createdAt = scoreEntryTime(data.createdAt);
        const existing = byInitials.get(initials);
        if (
          !existing ||
          score > existing.score ||
          (score === existing.score && createdAt && (!existing.createdAt || createdAt < existing.createdAt))
        ) {
          byInitials.set(initials, {
            initials,
            score,
            characterName: String(data.characterName || ""),
            createdAt
          });
        }
      }
      return Array.from(byInitials.values())
        .sort((a, b) => b.score - a.score || a.createdAt - b.createdAt)
        .slice(0, LEADERBOARD_LIMIT);
    }

    async function loadLeaderboard() {
      const board = state.leaderboard;
      board.dateKey = todayBoardKey();
      board.loading = true;
      board.inputRect = null;
      board.submitRect = null;
      board.restartRect = null;
      try {
        const firebase = await initLeaderboard();
        if (!firebase) {
          board.entries = [];
          return;
        }
        const { db, api } = firebase;
        const scoresRef = api.collection(db, LEADERBOARD_ROOT, board.dateKey, "scores");
        const scoresQuery = api.query(
          scoresRef,
          api.orderBy("score", "desc"),
          api.limit(50)
        );
        const snapshot = await api.getDocs(scoresQuery);
        board.entries = scoreboardEntriesFromSnapshot(snapshot);
        board.status = board.entries.length ? "Daily board loaded" : "No scores yet today";
      } catch (error) {
        board.entries = [];
        board.status = "Leaderboard unavailable";
        console.warn("Leaderboard load failed", error);
      } finally {
        board.loading = false;
      }
    }

    async function submitLeaderboardScore() {
      const board = state.leaderboard;
      if (board.submitted) {
        return;

      let initials = cleanInitials(board.initials);
      if (!initials) {
        const typed = window.prompt("Enter initials for the daily Top 5:", "");
        initials = cleanInitials(typed || "");
      }
      if (!initials) {
        board.status = "Enter initials to submit";
        return;
      }
      board.initials = initials;
      localStorage.setItem("pipBoyJetpackInitials", initials);
      board.loading = true;
      board.status = "Submitting score...";
      try {
        const firebase = await initLeaderboard();
        if (!firebase) {
          board.status = "Add Firebase config to submit scores";
          return;
        }
        const { db, api } = firebase;
        const character = characters[state.selectedCharacter] || characters[0];
        const score = Math.max(0, Math.floor(state.score));
        const scoresRef = api.collection(db, LEADERBOARD_ROOT, todayBoardKey(), "scores");
        await api.addDoc(scoresRef, {
          initials,
          score,
          characterId: character.id,
          characterName: character.name,
          createdAt: api.serverTimestamp()
        });
        board.submitted = true;
        await loadLeaderboard();
        const visibleEntry = board.entries.find((entry) => entry.initials === initials);
        if (visibleEntry && visibleEntry.score > score) {
          board.status = `${initials} stays at ${visibleEntry.score}`;
        } else if (visibleEntry && visibleEntry.score === score) {
          board.status = "Score submitted";
        } else {
          board.status = "Score saved";
        }
      } catch (error) {
        board.status = "Submit failed";
        console.warn("Leaderboard submit failed", error);
      } finally {
        board.loading = false;
      }
    }

    function playSilentUnlockPulse(audio) {
      if (!audio || state.audioUnlocked || audio.state !== "running") {
        return;
      }
      const gain = audio.createGain();
      const osc = audio.createOscillator();
      const now = audio.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      osc.frequency.setValueAtTime(40, now);
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start(now);
      osc.stop(now + 0.025);
      state.audioUnlocked = true;
    }

    function unlockAudio() {
      const audio = ensureAudio();
      if (!audio) {
        return null;

      if (audio.state === "suspended") {
        const resume = audio.resume();
        if (resume && typeof resume.then === "function") {
          resume.then(() => playSilentUnlockPulse(audio)).catch(() => {});
        }
        if (resume && typeof resume.catch === "function") {
          resume.catch(() => {});
        }
      } else {
        playSilentUnlockPulse(audio);
      }
      return audio;
    }

    function playTone(type) {
      const audio = ensureAudio();
      if (!audio) {
        return;
      }
      if (audio.state === "suspended") {
        audio.resume().then(() => playTone(type)).catch(() => {});
        return;
      }
      state.audioUnlocked = true;

      const now = audio.currentTime;
      const gain = audio.createGain();
      const osc = audio.createOscillator();
      const filter = audio.createBiquadFilter();
      const settings = {
        boost: { start: 150, end: 430, wave: "sawtooth", volume: 0.05, duration: 0.16 },
        cap: { start: 720, end: 1080, wave: "triangle", volume: 0.08, duration: 0.12 },
        score: { start: 420, end: 620, wave: "square", volume: 0.035, duration: 0.08 },
        crash: { start: 130, end: 48, wave: "sawtooth", volume: 0.12, duration: 0.5 },
        select: { start: 520, end: 760, wave: "triangle", volume: 0.06, duration: 0.14 },
        start: { start: 260, end: 520, wave: "square", volume: 0.05, duration: 0.18 }
      }[type];

      if (!settings) {
        return;
      }

      osc.type = settings.wave;
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(type === "crash" ? 480 : 1800, now);
      osc.frequency.setValueAtTime(settings.start, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, settings.end), now + settings.duration);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(settings.volume, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + settings.duration);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audio.destination);
      osc.start(now);
      osc.stop(now + settings.duration + 0.03);
    }

    function playDuckSound() {
      const audio = ensureAudio();
      if (!audio) {
        return;
      }
      if (audio.state === "suspended") {
        audio.resume().then(() => playDuckSound()).catch(() => {});
        return;
      }
      state.audioUnlocked = true;

      const now = audio.currentTime;
      [0, 0.075].forEach((offset, index) => {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        const filter = audio.createBiquadFilter();
        const noise = audio.createBufferSource();
        const noiseGain = audio.createGain();
        const noiseFilter = audio.createBiquadFilter();
        const start = now + offset;
        const duration = index === 0 ? 0.16 : 0.12;
        const noiseBuffer = audio.createBuffer(1, Math.floor(audio.sampleRate * duration), audio.sampleRate);
        const noiseData = noiseBuffer.getChannelData(0);

        for (let i = 0; i < noiseData.length; i += 1) {
          const fade = 1 - i / noiseData.length;
          noiseData[i] = (Math.random() * 2 - 1) * fade;
        }

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(index === 0 ? 470 : 390, start);
        osc.frequency.exponentialRampToValueAtTime(index === 0 ? 155 : 135, start + duration);
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(index === 0 ? 820 : 680, start);
        filter.frequency.exponentialRampToValueAtTime(index === 0 ? 520 : 440, start + duration);
        filter.Q.setValueAtTime(4.5, start);
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(index === 0 ? 0.18 : 0.12, start + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
        noise.buffer = noiseBuffer;
        noiseFilter.type = "bandpass";
        noiseFilter.frequency.setValueAtTime(index === 0 ? 1150 : 980, start);
        noiseFilter.Q.setValueAtTime(1.7, start);
        noiseGain.gain.setValueAtTime(0.001, start);
        noiseGain.gain.exponentialRampToValueAtTime(index === 0 ? 0.065 : 0.045, start + 0.012);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, start + duration);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audio.destination);
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audio.destination);
        osc.start(start);
        noise.start(start);
        osc.stop(start + duration + 0.03);
        noise.stop(start + duration + 0.03);
      });
    }
