      state.characterPage = pageForCharacter(state.selectedCharacter);
      clearRun();
      state.phase = "select";
      playTone("select");
      updateHud();
    }

    function showScoreboardViewer() {
      resetSelectTapTracker();
      state.phase = "scoreboard";
      state.leaderboard.status = "Loading daily top 5...";
      state.leaderboard.inputRect = null;
      state.leaderboard.submitRect = null;
      state.leaderboard.restartRect = null;
      state.leaderboard.backRect = null;
      loadLeaderboard();
      playTone("select");
      updateHud();
    }

    function resetGame() {
      if (state.gameOverTimer > 0) {
        return;
      }

      if (state.phase === "intro") {
        showModeSelect();
        return;
      }

      if (state.phase === "mode") {
        chooseGameMode(state.modeFocus);
        return;
      }

      if (state.phase === "select") {
        chooseCharacter(state.selectedCharacter);
        return;
      }

      if (state.phase === "scoreboard") {
        showCharacterSelect();
        return;
      }

      playTone("start");
      state.phase = "running";
      state.time = 0;
      clearRun();
      state.player.vy = -320;

      for (let i = 0; i < 5; i += 1) {
        spawnObstacle(state.width + 120 + i * 280);
      }
      updateHud();
    }

    function resizeCanvas() {
      syncViewportHeight();
      const rect = canvas.getBoundingClientRect();
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(rect.width * scale));
      canvas.height = Math.max(1, Math.floor(rect.height * scale));
      applyViewportSize(rect.width, rect.height);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      resetBackgroundLayerCache();
      resetGameplaySpriteCache();
      seedStars();
    }

    function resetBackgroundLayerCache() {
      backgroundLayerCache = null;
    }

    function resetGameplaySpriteCache() {
      gameplaySpriteCacheScale = 0;
      for (const character of characters) {
        character.gameplayCache = null;
      }
    }

    function prepareGameplaySprite(character) {
      const image = character.image;
      if (!image.complete || !image.naturalWidth || !image.naturalHeight) {
        return null;
      }

      const spriteW = gameplaySpriteWidth(character);
      const spriteH = spriteW * (image.naturalHeight / image.naturalWidth);
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      const canvasW = Math.ceil(GAMEPLAY_CACHE_BOX * scale);
      const canvasH = Math.ceil(GAMEPLAY_CACHE_BOX * scale);
      const cacheCanvas = document.createElement("canvas");
      cacheCanvas.width = canvasW;
      cacheCanvas.height = canvasH;
      const cacheCtx = cacheCanvas.getContext("2d");
      cacheCtx.imageSmoothingEnabled = true;
      cacheCtx.imageSmoothingQuality = "high";
      cacheCtx.scale(scale, scale);
      cacheCtx.translate(GAMEPLAY_CACHE_BOX / 2, GAMEPLAY_CACHE_BOX / 2);
      cacheCtx.shadowColor = "rgba(156, 255, 109, 0.45)";
      cacheCtx.shadowBlur = 14;
      cacheCtx.drawImage(image, -spriteW * 0.5, -spriteH * 0.5, spriteW, spriteH);

      const cache = {
        source: cacheCanvas,
        width: GAMEPLAY_CACHE_BOX,
        height: GAMEPLAY_CACHE_BOX
      };
      character.gameplayCache = cache;
      if (typeof createImageBitmap === "function") {
        createImageBitmap(cacheCanvas).then((bitmap) => {
          if (character.gameplayCache === cache) {
            cache.source = bitmap;
          }
        }).catch(() => {
          cache.source = cacheCanvas;
        });
      }
      return character.gameplayCache;
    }

    function getGameplaySpriteCache(character) {
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      if (gameplaySpriteCacheScale !== scale) {
        resetGameplaySpriteCache();
        gameplaySpriteCacheScale = scale;
      }
      return character.gameplayCache || prepareGameplaySprite(character);
    }

    function seedStars() {
      const count = Math.floor((state.width * state.height) / 9000);
      state.stars = Array.from({ length: count }, () => ({
        x: Math.random() * state.width,
        y: Math.random() * state.height,
        z: rand(0.15, 1),
        blink: Math.random() * Math.PI * 2
      }));
    }

    function randomObstacleSpritePair() {
      const first = Math.floor(Math.random() * obstacleSprites.length);
      if (obstacleSprites.length < 2 || Math.random() < 0.58) {
        return {
          topSprite: first,
          bottomSprite: first,
          mixSprites: false
        };
      }
      const second = (first + 1 + Math.floor(Math.random() * (obstacleSprites.length - 1))) % obstacleSprites.length;
      return {
        topSprite: first,
        bottomSprite: second,
        mixSprites: true
      };
    }

    function spawnObstacle(x = state.width + 80) {
      const margin = Math.max(70, state.height * 0.12);
      const gap = clamp(state.gap - state.score * 0.75, 178, 238);
      const center = rand(margin + gap * 0.5, state.height - margin - gap * 0.5);
      const width = rand(74, 98);
      const sprites = randomObstacleSpritePair();
      state.obstacles.push({
        x,
        width,
        gapTop: center - gap * 0.5,
        gapBottom: center + gap * 0.5,
        passed: false,
        stripe: Math.random() > 0.5 ? 1 : -1,
        topSprite: sprites.topSprite,
        bottomSprite: sprites.bottomSprite,
        mixSprites: sprites.mixSprites
      });

      state.caps.push({
        x: x + width * 0.5,
        y: center,
        r: 13,
        sprite: Math.floor(Math.random() * coinSprites.length),
        taken: false,
        spin: Math.random() * Math.PI * 2
      });
    }

    function thrust() {
      if (state.phase === "select") {
        chooseCharacter(state.selectedCharacter);
        return;
      }
      if (state.phase === "ready" || state.phase === "over") {
        if (state.gameOverTimer > 0) {
          return;
        }
        resetGame();
        return;
      }
      if (state.phase !== "running") {
        return;
      }
      if (!usesFixedWorld() && state.player.charge < BOOST_COST) {
        playTone("score");
        return;
      }

      state.player.vy = -350;
      if (usesFixedWorld()) {
        state.player.charge = 1;
      } else {
        state.player.charge = clamp(state.player.charge - BOOST_COST, 0, 1);
      }
      countBackgroundJump();
      playTone("boost");
      burst(state.player.x - 30, state.player.y + 16, 12, "#ffc857");
    }

    function countBackgroundJump() {
      state.backgroundJumpCount += 1;
      if (state.backgroundJumpCount < BACKGROUND_JUMPS_PER_SCENE) {
        return;
      }

      state.backgroundJumpCount = 0;
      advanceBackgroundScene();
    }

    function advanceBackgroundScene() {
      const loadedIndexes = backgroundImages
        .map((image, index) => ({ image, index }))
        .filter(({ image }) => image.complete && image.naturalWidth)
        .map(({ index }) => index);

      if (!loadedIndexes.length) {
        return;
      }

      state.backgroundPreviousSceneIndex = state.backgroundSceneIndex;
      const currentIndex = ((state.backgroundSceneIndex % backgroundImages.length) + backgroundImages.length) % backgroundImages.length;
      const choices = loadedIndexes.filter((index) => index !== currentIndex);
      const pool = choices.length ? choices : loadedIndexes;
      state.backgroundSceneIndex = pool[Math.floor(Math.random() * pool.length)];
      state.backgroundTransitionTime = BACKGROUND_TRANSITION_SECONDS;
    }

    function burst(x, y, count, color) {
      for (let i = 0; i < count; i += 1) {
        state.particles.push({
          x,
          y,
          vx: rand(-120, -28),
          vy: rand(-80, 96),
          life: rand(0.22, 0.55),
          maxLife: rand(0.45, 0.8),
          size: rand(2, 5),
          color
        });
      }
    }

    function crash() {
      if (state.phase !== "running") {
        return;
      }

      state.phase = "over";
      state.gameOverTimer = 3;
      state.shake = 16;
      playTone("crash");
      burst(state.player.x, state.player.y, 28, "#ff5d4d");
      state.leaderboard.submitted = false;
      state.leaderboard.status = "Loading daily top 5...";
      loadLeaderboard();
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem("pipBoyJetpackBest", String(state.best));
      }
      updateHud();
    }

    function togglePause() {
      if (state.phase === "running") {
        state.phase = "paused";
      } else if (state.phase === "paused") {
        state.phase = "running";
        state.last = performance.now();
      }
      updateHud();
    }

    function radioReset() {
      state.gameOverTimer = 0;
      resetGame();
    }

    function startOrRestartControl() {
      state.gameOverTimer = 0;
      resetGame();
    }

    function homeControl() {
      showCharacterSelect();
    }

    function statControlAction() {
      if (isMobileCabinet()) {
        startOrRestartControl();
        return;
      }
      showCharacterSelect();
    }

    function radioControlAction() {
      if (isMobileCabinet()) {
        homeControl();
        return;
      }
      radioReset();
    }

    function update(dt) {
      state.time += dt;
      state.backgroundTransitionTime = Math.max(0, state.backgroundTransitionTime - dt);
      state.shake = Math.max(0, state.shake - dt * 26);
      state.gameOverTimer = Math.max(0, state.gameOverTimer - dt);

      if (state.phase !== "running") {
        updateParticles(dt);
        updateHud();
        return;
      }

      const player = state.player;
      const gravity = 880;
      player.vy += gravity * dt;
      player.y += player.vy * dt;
      player.rotation = clamp(player.vy / 650, -0.5, 0.72);
      player.charge = usesFixedWorld() ? 1 : clamp(player.charge + dt * 0.22, 0, 1);

      const speed = state.speed + Math.min(170, state.score * 7.2);
      state.distance += speed * dt * 0.28;
      for (const star of state.stars) {
        star.x -= speed * star.z * dt * 0.16;
        if (star.x < -4) {
          star.x = state.width + 4;
          star.y = Math.random() * state.height;
        }
      }

      for (const obstacle of state.obstacles) {
        obstacle.x -= speed * dt;
        if (!obstacle.passed && obstacle.x + obstacle.width < player.x) {
          obstacle.passed = true;
          state.score += 1;
          playTone("score");
          burst(player.x - 18, player.y - 28, 7, "#9cff6d");
        }
      }

      for (const cap of state.caps) {
        cap.x -= speed * dt;
        cap.spin += dt * 2.2;
        if (!cap.taken && Math.hypot(cap.x - player.x, cap.y - player.y) < player.radius + cap.r) {
          cap.taken = true;
          state.score += 2;
          state.capsCollected += 1;
          if (state.capsCollected % CAP_MILESTONE === 0) {
            state.player.charge = clamp(state.player.charge + rollCapRecharge(), 0, 1);
            burst(cap.x, cap.y, 8, "#9cff6d");
          }
          playDuckSound();
          burst(cap.x, cap.y, 14, "#ffc857");
        }
      }

      state.obstacles = state.obstacles.filter((obstacle) => obstacle.x > -obstacle.width - 20);
      state.caps = state.caps.filter((cap) => cap.x > -40 && !cap.taken);
      while (state.obstacles.length < 5) {
        const last = state.obstacles[state.obstacles.length - 1];
        spawnObstacle((last ? last.x : state.width) + rand(250, 330));
      }

      const floor = state.height - 42;
      if (player.y - player.radius < 18 || player.y + player.radius > floor) {
        crash();
      }

      for (const obstacle of state.obstacles) {
        if (hitsObstacle(player, obstacle)) {
          crash();
          break;
        }
      }

      updateParticles(dt);
      updateHud();
    }

    function circleRect(cx, cy, cr, rx, ry, rw, rh) {
      const closestX = clamp(cx, rx, rx + rw);
      const closestY = clamp(cy, ry, ry + rh);
      return Math.hypot(cx - closestX, cy - closestY) < cr;
    }

    function hitsObstacle(player, obstacle) {
      const hitInsetX = 18;
      const hitInsetY = 16;
      const hitW = Math.max(12, obstacle.width - hitInsetX * 2);
      const hitR = player.radius * 0.72;

      return circleRect(
        player.x,
        player.y,
        hitR,
        obstacle.x + hitInsetX,
        -40,
        hitW,
        Math.max(0, obstacle.gapTop + 40 - hitInsetY)
      ) || circleRect(
        player.x,
        player.y,
        hitR,
        obstacle.x + hitInsetX,
        obstacle.gapBottom + hitInsetY,
        hitW,
        Math.max(0, state.height - obstacle.gapBottom - hitInsetY)
      );
    }

    function updateParticles(dt) {
      for (const particle of state.particles) {
        particle.life -= dt;
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vy += 230 * dt;
      }
      state.particles = state.particles.filter((particle) => particle.life > 0);
    }

    function updateHud() {
      const phaseLabel = {
        intro: "Intro",
        mode: "Mode",
        select: "Select",
        ready: "Ready",
        running: "Running",
        paused: "Paused",
        over: state.gameOverTimer > 0 ? "Game Over" : "Signal Lost",
        scoreboard: "Scoreboard"
      }[state.phase];

      document.body.dataset.phase = state.phase;
      modeText.textContent = state.phase === "mode" || state.phase === "select" || state.phase === "ready" || state.phase === "running"
        ? `${phaseLabel} / ${modeDisplayName(state.gameMode)}`
        : phaseLabel;
      scoreText.textContent = String(state.score);
      bestText.textContent = String(Math.max(state.best, state.score));
      const charge = Math.round(state.player.charge * 100);
      const capProgress = state.capsCollected % CAP_MILESTONE;
      chargeText.textContent = `${charge}%`;
      capsText.textContent = `${capProgress}/${CAP_MILESTONE}`;
      chargeBar.style.transform = `scaleX(${state.player.charge})`;
      mobileScoreText.textContent = String(state.score);
      mobileBestText.textContent = String(Math.max(state.best, state.score));
      mobileChargeText.textContent = `${charge}%`;
      mobileCapsText.textContent = `Caps ${capProgress}/${CAP_MILESTONE}`;
      mobileChargeBar.style.transform = `scaleX(${state.player.charge})`;
      mobileDistanceText.textContent = String(Math.floor(state.distance));
      startButton.textContent = state.phase === "scoreboard" ? "Back" : state.phase === "mode" ? "Mode" : state.phase === "select" ? "Choose" : state.phase === "running" ? "Restart" : "Start";
      pauseButton.textContent = state.phase === "paused" ? "Resume" : "Pause";
      mobileRestartButton.textContent = state.phase === "scoreboard" ? "Back" : state.phase === "intro" ? "Start" : state.phase === "mode" ? "Mode" : state.phase === "select" ? "Choose" : state.phase === "ready" ? "Start" : "Restart";
      mobilePauseButton.textContent = state.phase === "paused" ? "Resume" : "Pause";
      statControl.textContent = state.phase === "running" ? "Start" : "Start";
      dataControl.textContent = state.phase === "paused" ? "Resume" : "Pause";
      radioControl.textContent = "Home";
      soundButton.textContent = state.soundEnabled ? "Sound On" : "Sound Off";
      soundButton.setAttribute("aria-pressed", String(state.soundEnabled));
    }

    function draw() {
      const sx = state.shake ? rand(-state.shake, state.shake) : 0;
      const sy = state.shake ? rand(-state.shake, state.shake) : 0;
      ctx.save();
      ctx.clearRect(0, 0, state.displayWidth, state.displayHeight);
      if (usesFixedWorld()) {
        ctx.fillStyle = "#050605";
        ctx.fillRect(0, 0, state.displayWidth, state.displayHeight);
        ctx.save();
        ctx.translate(state.viewport.x, state.viewport.y);
        ctx.scale(state.viewport.scale, state.viewport.scale);
        ctx.beginPath();
        ctx.rect(0, 0, state.width, state.height);
        ctx.clip();
      }
      ctx.translate(sx, sy);

      drawBackground();
      if (state.phase === "intro") {
        drawIntroScreen();
        if (usesFixedWorld()) {
          ctx.restore();
        }
        ctx.restore();
        return;
      }
      if (state.phase === "mode") {
        drawModeSelect();
        if (usesFixedWorld()) {
          ctx.restore();
        }
        ctx.restore();
        return;
      }
      if (state.phase === "select") {
        drawCharacterSelect();
        if (usesFixedWorld()) {
          ctx.restore();
        }
        ctx.restore();
        return;
      }
      if (state.phase === "scoreboard") {
        drawLeaderboardPanel({ viewer: true });
        if (usesFixedWorld()) {
          ctx.restore();
        }
        ctx.restore();
        return;
      }

      drawObstacles();
      drawCaps();
      drawPlayer();
      drawParticles();
      drawHudOverlay();

      if (state.phase === "ready") {
        drawMessage(`${characters[state.selectedCharacter].readyName.toUpperCase()} READY`, "Space, click, tap, or BOOST");
      } else if (state.phase === "paused") {
        drawMessage("PAUSED", "Press P or Resume");
      } else if (state.phase === "over") {
        if (state.gameOverTimer > 0) {
          drawGameOverScreen();
        } else {
          drawLeaderboardPanel();
        }
      }

      if (usesFixedWorld()) {
        ctx.restore();
      }
      ctx.restore();
    }

    function drawBackground() {
      const mobileCabinet = isMobileCabinet();
      const loadedBackground = backgroundImages.find((image) => image.complete && image.naturalWidth);
      if (loadedBackground) {
        const bgOffsetY = state.phase === "select"
          ? 0
          : clamp((state.player.y - state.height * 0.48) * 0.1, -18, 18);
        const currentIndex = ((state.backgroundSceneIndex % backgroundImages.length) + backgroundImages.length) % backgroundImages.length;
        const currentBackground = backgroundImages[currentIndex].complete && backgroundImages[currentIndex].naturalWidth
          ? backgroundImages[currentIndex]
          : loadedBackground;
        const previousIndex = ((state.backgroundPreviousSceneIndex % backgroundImages.length) + backgroundImages.length) % backgroundImages.length;
        const previousBackground = backgroundImages[previousIndex].complete && backgroundImages[previousIndex].naturalWidth
          ? backgroundImages[previousIndex]
          : currentBackground;
        const transitionProgress = BACKGROUND_TRANSITION_SECONDS > 0
          ? clamp(1 - state.backgroundTransitionTime / BACKGROUND_TRANSITION_SECONDS, 0, 1)
          : 1;
        const fade = transitionProgress * transitionProgress * (3 - 2 * transitionProgress);

        if (state.backgroundTransitionTime > 0 && previousBackground !== currentBackground) {
          drawBackgroundLayer(previousIndex, previousBackground, bgOffsetY);
          ctx.save();
          ctx.globalAlpha = fade;
          drawBackgroundLayer(currentIndex, currentBackground, bgOffsetY);
          ctx.restore();
        } else {
          drawBackgroundLayer(currentIndex, currentBackground, bgOffsetY);
        }

        ctx.fillStyle = mobileCabinet ? "rgba(6, 10, 8, 0.05)" : "rgba(6, 22, 8, 0.24)";
        ctx.fillRect(0, 0, state.width, state.height);

        const bottomShade = ctx.createLinearGradient(0, state.height * 0.68, 0, state.height);
        bottomShade.addColorStop(0, "rgba(0, 0, 0, 0)");
        bottomShade.addColorStop(1, "rgba(0, 0, 0, 0.42)");
        ctx.fillStyle = bottomShade;
        ctx.fillRect(0, 0, state.width, state.height);

        if (!mobileCabinet) {
          ctx.strokeStyle = "rgba(156, 255, 109, 0.18)";
          ctx.lineWidth = 2;
          for (let x = -80 + (state.time * 120) % 80; x < state.width + 80; x += 80) {
            ctx.beginPath();
            ctx.moveTo(x, state.height - 40);
            ctx.lineTo(x + 36, state.height);
            ctx.stroke();
          }
        }
        return;
      }

      const gradient = ctx.createLinearGradient(0, 0, 0, state.height);
      gradient.addColorStop(0, "#0a1910");
      gradient.addColorStop(0.55, "#102512");
      gradient.addColorStop(1, "#071008");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, state.width, state.height);

      ctx.fillStyle = "rgba(156, 255, 109, 0.35)";
      for (const star of state.stars) {
        const pulse = 0.35 + Math.sin(state.time * 2 + star.blink) * 0.18;
        ctx.globalAlpha = clamp(star.z * pulse, 0.08, 0.4);
        ctx.fillRect(star.x, star.y, 2, 2);
      }
      ctx.globalAlpha = 1;

      drawRuinsLayer(state.height - 116, 0.35, "#142518", 36);
      drawRuinsLayer(state.height - 78, 0.55, "#1a2d1c", 64);

      ctx.fillStyle = "#172314";
      ctx.fillRect(0, state.height - 42, state.width, 42);
      if (!mobileCabinet) {
        ctx.strokeStyle = "rgba(156, 255, 109, 0.18)";
        ctx.lineWidth = 2;
        for (let x = -80 + (state.time * 120) % 80; x < state.width + 80; x += 80) {
          ctx.beginPath();
          ctx.moveTo(x, state.height - 40);
          ctx.lineTo(x + 36, state.height);
          ctx.stroke();
        }
      }
    }

    function drawIntroScreen() {
      ctx.save();
      if (introImage.complete && introImage.naturalWidth) {
        drawCoverImage(introImage, 0, 0, state.width, state.height);
      } else {
        const gradient = ctx.createLinearGradient(0, 0, state.width, state.height);
        gradient.addColorStop(0, "#161033");
        gradient.addColorStop(0.48, "#220b2e");
        gradient.addColorStop(1, "#05162f");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, state.width, state.height);
        ctx.textAlign = "center";
        ctx.fillStyle = "#f8f3dc";
        fitMonoFont("DUCK DUCK NUKE", 54, 28, state.width - 60);
        ctx.fillText("DUCK DUCK NUKE", state.width / 2, state.height * 0.46);
        ctx.fillStyle = "#ffc857";
        fitMonoFont("BY WULFZX.UNDERGROUND", 20, 12, state.width - 80);
        ctx.fillText("BY WULFZX.UNDERGROUND", state.width / 2, state.height * 0.54);
      }

      const prompt = startPromptText();
      const promptY = state.height - clamp(state.height * 0.11, 48, 74);
      const boxW = Math.max(96, Math.min(clamp(state.width * 0.52, 230, 430), state.width - 24));
      const boxH = clamp(state.height * 0.105, 42, 58);
      const boxX = (state.width - boxW) / 2;
      const boxY = promptY - boxH * 0.68;
      ctx.fillStyle = "rgba(3, 8, 5, 0.72)";
      ctx.strokeStyle = "rgba(255, 200, 87, 0.82)";
      ctx.lineWidth = 2;
      roundRect(boxX, boxY, boxW, boxH, 7, true, true);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff2b6";
      ctx.shadowColor = "rgba(255, 200, 87, 0.85)";
      ctx.shadowBlur = 12 + Math.sin(state.time * 5) * 4;
      fitMonoFont(prompt, 24, 13, boxW - 26);
      ctx.fillText(prompt, state.width / 2, boxY + boxH / 2);
      ctx.shadowBlur = 0;
      ctx.textBaseline = "alphabetic";
      ctx.restore();
    }

    function drawModeSelect() {
      ctx.save();
      ctx.fillStyle = "rgba(5, 12, 6, 0.46)";
      ctx.fillRect(0, 0, state.width, state.height);
      ctx.textAlign = "center";
      ctx.fillStyle = "#9cff6d";
      ctx.shadowColor = "rgba(156, 255, 109, 0.55)";
      ctx.shadowBlur = 14;
      fitMonoFont("SELECT MODE", 34, 20, state.width - 44);
      ctx.fillText("SELECT MODE", state.width / 2, clamp(state.height * 0.19, 54, 92));
      ctx.shadowBlur = 0;

      const cardGap = clamp(state.width * 0.045, 18, 34);
      const cardW = clamp((state.width - cardGap - 80) / 2, 190, 300);
      const cardH = clamp(state.height * 0.28, 128, 178);
      const totalW = cardW * 2 + cardGap;
      const startX = (state.width - totalW) / 2;
      const y = clamp(state.height * 0.36, 134, state.height - cardH - 86);
      const modes = [
        {
          mode: "easy",
          title: "EASY MODE",
          lines: ["STANDARD SCREEN", "UNLIMITED BOOST"]
        },
        {
          mode: "hard",
          title: "HARD MODE",
          lines: ["FULL SCREEN PHYSICS", "CORE CHARGE COSTS"]
        }
      ];

      state.modeButtonRects = modes.map((item, index) => {
        const rect = { x: startX + index * (cardW + cardGap), y, w: cardW, h: cardH, mode: item.mode };
        const selected = state.modeFocus === item.mode;
        ctx.fillStyle = selected ? "rgba(156, 255, 109, 0.16)" : "rgba(5, 12, 6, 0.88)";
        ctx.strokeStyle = selected ? "#9cff6d" : "rgba(156, 255, 109, 0.42)";
        ctx.lineWidth = selected ? 3 : 2;
        ctx.shadowColor = selected ? "rgba(156, 255, 109, 0.38)" : "transparent";
        ctx.shadowBlur = selected ? 18 : 0;
        roundRect(rect.x, rect.y, rect.w, rect.h, 8, true, true);
        ctx.shadowBlur = 0;

        ctx.fillStyle = selected ? "#ffffff" : "#9cff6d";
        fitMonoFont(item.title, 24, 14, rect.w - 22);
        ctx.fillText(item.title, rect.x + rect.w / 2, rect.y + 42);

        ctx.fillStyle = "rgba(217, 255, 208, 0.78)";
        item.lines.forEach((line, lineIndex) => {
          fitMonoFont(line, 15, 9, rect.w - 24);
          ctx.fillText(line, rect.x + rect.w / 2, rect.y + 78 + lineIndex * 24);
        });

        ctx.fillStyle = selected ? "#ffc857" : "rgba(217, 255, 208, 0.7)";
        fitMonoFont(selected ? "READY" : "SELECT", 15, 9, rect.w - 22);
        ctx.fillText(selected ? "READY" : "SELECT", rect.x + rect.w / 2, rect.y + rect.h - 20);
        return rect;
      });

      ctx.fillStyle = "rgba(217, 255, 208, 0.78)";
      fitMonoFont("CLICK/TAP A MODE TO CONTINUE", 15, 9, state.width - 42);
      ctx.fillText("CLICK/TAP A MODE TO CONTINUE", state.width / 2, state.height - 34);
      ctx.restore();
    }

    function drawBackgroundLayer(index, fallbackImage, offsetY) {
      const layer = getBackgroundLayer(index);
      if (!layer) {
        drawCoverImage(fallbackImage, 0, 0, state.width, state.height, 0, offsetY, BACKGROUND_LAYER_ZOOM);
        return;
      }

      const maxOffsetY = Math.max(0, (layer.height - state.height) * 0.5);
      const drawX = layer.x;
      const drawY = layer.y + clamp(offsetY, -maxOffsetY, maxOffsetY);
      ctx.drawImage(layer.canvas, drawX, drawY, layer.width, layer.height);
    }

    function getBackgroundLayer(index) {
      const image = backgroundImages[index];
      if (!image || !image.complete || !image.naturalWidth) {
        return null;
      }

      const cacheWidth = Math.max(1, Math.round(state.width));
      const cacheHeight = Math.max(1, Math.round(state.height));
      const cacheKey = `${cacheWidth}x${cacheHeight}:${BACKGROUND_LAYER_ZOOM}`;
      if (!backgroundLayerCache || backgroundLayerCache.key !== cacheKey) {
        backgroundLayerCache = { key: cacheKey, layers: new Map() };
      }

      if (backgroundLayerCache.layers.has(index)) {
        return backgroundLayerCache.layers.get(index);
      }

      const imageRatio = image.naturalWidth / image.naturalHeight;
      const targetRatio = state.width / state.height;
      let layerWidth = state.width;
      let layerHeight = state.height;
      if (targetRatio > imageRatio) {
        layerHeight = state.width / imageRatio;
      } else {
        layerWidth = state.height * imageRatio;
      }

      layerWidth = Math.max(1, Math.ceil(layerWidth * BACKGROUND_LAYER_ZOOM));
      layerHeight = Math.max(1, Math.ceil(layerHeight * BACKGROUND_LAYER_ZOOM));

      const canvasLayer = document.createElement("canvas");
      canvasLayer.width = layerWidth;
      canvasLayer.height = layerHeight;
      const layerCtx = canvasLayer.getContext("2d");
      layerCtx.imageSmoothingEnabled = true;
      layerCtx.imageSmoothingQuality = "high";
      layerCtx.drawImage(image, 0, 0, layerWidth, layerHeight);

      const layer = {
        canvas: canvasLayer,
        width: layerWidth,
        height: layerHeight,
        x: (state.width - layerWidth) * 0.5,
        y: (state.height - layerHeight) * 0.5
      };
      backgroundLayerCache.layers.set(index, layer);
      return layer;
    }

    function drawCharacterSelect() {
      const titleY = clamp(state.height * 0.14, 32, 46);
      ctx.save();
      ctx.fillStyle = "rgba(5, 12, 6, 0.42)";
      ctx.fillRect(0, 0, state.width, state.height);

      ctx.textAlign = "center";
      ctx.fillStyle = "#9cff6d";
      ctx.shadowColor = "rgba(156, 255, 109, 0.55)";
      ctx.shadowBlur = 14;
      fitMonoFont("CHOOSE YOUR GOOSE", 30, 18, state.width - 44);
      ctx.fillText("CHOOSE YOUR GOOSE", state.width / 2, titleY);
      ctx.shadowBlur = 0;
      ctx.fillStyle = state.gameMode === "easy" ? "#ffc857" : "rgba(217, 255, 208, 0.84)";
      fitMonoFont(modeLabel(), 14, 9, state.width - 60);
      ctx.fillText(modeLabel(), state.width / 2, titleY + 17);

      const pageCount = characterPageCount();
      const range = visibleCharacterRange();
      state.characterPage = range.page;
      const visibleCharacters = characters.slice(range.start, range.end);
      const count = visibleCharacters.length;
      const columns = pageCount > 1 ? 4 : count <= 4 ? count : 4;
      const rows = pageCount > 1 ? 2 : Math.ceil(count / columns);
      const sidePad = clamp(state.width * 0.035, 10, 18);
      const gapX = clamp(state.width * 0.018, 5, 10);
      const gapY = clamp(state.height * 0.025, 5, 9);
      const hintY = state.height - 14;
      const pageControlY = hintY - 25;
      const boardButtonH = clamp(state.height * 0.046, 18, 24);
      const boardControlY = pageCount > 1 ? pageControlY - boardButtonH - 8 : hintY - boardButtonH - 5;
      const gridTop = clamp(titleY + 34, 64, state.height * 0.31);
      const gridBottom = boardControlY - 8;
      const cardW = Math.max(44, (state.width - sidePad * 2 - gapX * (columns - 1)) / columns);
      const cardH = clamp((gridBottom - gridTop - gapY * (rows - 1)) / rows, 62, 118);
      const totalW = cardW * columns + gapX * (columns - 1);
      const totalH = cardH * rows + gapY * (rows - 1);
      const startX = (state.width - totalW) / 2;
      const startY = gridTop + Math.max(0, (gridBottom - gridTop - totalH) / 2);
      state.selectionRects = visibleCharacters.map((character, visibleIndex) => {
        const index = range.start + visibleIndex;
        const col = visibleIndex % columns;
        const row = Math.floor(visibleIndex / columns);
        const x = startX + col * (cardW + gapX);
        const y = startY + row * (cardH + gapY);
        const selected = index === state.selectedCharacter;
        drawPilotCard(character, x, y, cardW, cardH, selected);
        return { x, y, w: cardW, h: cardH, index };
      });
      state.pageButtonRects = [];
      state.scoreboardButtonRect = null;
      state.changeModeButtonRect = null;

      if (pageCount > 1) {
        const buttonW = clamp(state.width * 0.095, 34, 48);
        const buttonH = clamp(state.height * 0.052, 17, 24);
        const centerX = state.width / 2;
        const prevRect = { x: centerX - buttonW - 57, y: pageControlY - buttonH + 7, w: buttonW, h: buttonH, direction: -1 };
        const nextRect = { x: centerX + 57, y: pageControlY - buttonH + 7, w: buttonW, h: buttonH, direction: 1 };
        state.pageButtonRects = [prevRect, nextRect];

        [prevRect, nextRect].forEach((rect) => {
          ctx.fillStyle = "rgba(5, 12, 6, 0.82)";
          ctx.strokeStyle = "rgba(156, 255, 109, 0.58)";
          ctx.lineWidth = 2;
          roundRect(rect.x, rect.y, rect.w, rect.h, 5, true, true);
          ctx.fillStyle = "#9cff6d";
          fitMonoFont(rect.direction < 0 ? "<" : ">", 16, 10, rect.w - 10);
          ctx.fillText(rect.direction < 0 ? "<" : ">", rect.x + rect.w / 2, rect.y + rect.h - 6);
        });

        ctx.fillStyle = "rgba(217, 255, 208, 0.82)";
        const pageLabel = `PAGE ${range.page + 1}/${pageCount}`;
        fitMonoFont(pageLabel, 12, 8, 92);
        ctx.fillText(pageLabel, centerX, pageControlY);
      }

      const boardW = clamp(state.width * 0.23, 96, 142);
      const buttonGap = clamp(state.width * 0.018, 8, 14);
      const changeW = clamp(state.width * 0.23, 98, 144);
      const buttonsW = boardW + changeW + buttonGap;
      const boardRect = {
        x: state.width / 2 - buttonsW / 2,
        y: boardControlY,
        w: boardW,
        h: boardButtonH
      };
      const changeModeRect = {
        x: boardRect.x + boardW + buttonGap,
        y: boardControlY,
        w: changeW,
        h: boardButtonH
      };
      state.scoreboardButtonRect = boardRect;
      state.changeModeButtonRect = changeModeRect;
      ctx.fillStyle = "rgba(255, 200, 87, 0.11)";
      ctx.strokeStyle = "rgba(255, 200, 87, 0.64)";
      ctx.lineWidth = 2;
      roundRect(boardRect.x, boardRect.y, boardRect.w, boardRect.h, 5, true, true);
      ctx.fillStyle = "#ffc857";
      fitMonoFont("SCOREBOARD", 13, 8, boardRect.w - 12);
      ctx.fillText("SCOREBOARD", boardRect.x + boardRect.w / 2, boardRect.y + boardRect.h - 6);
      ctx.fillStyle = "rgba(156, 255, 109, 0.11)";
      ctx.strokeStyle = "rgba(156, 255, 109, 0.58)";
      ctx.lineWidth = 2;
      roundRect(changeModeRect.x, changeModeRect.y, changeModeRect.w, changeModeRect.h, 5, true, true);
      ctx.fillStyle = "#9cff6d";
      fitMonoFont("CHANGE MODE", 13, 8, changeModeRect.w - 12);
      ctx.fillText("CHANGE MODE", changeModeRect.x + changeModeRect.w / 2, changeModeRect.y + changeModeRect.h - 6);

      ctx.fillStyle = "rgba(217, 255, 208, 0.78)";
      fitMonoFont("CLICK/TAP TO PREVIEW / DOUBLE TO LAUNCH", 13, 8, state.width - 36);
      ctx.fillText("CLICK/TAP TO PREVIEW / DOUBLE TO LAUNCH", state.width / 2, hintY);
      ctx.restore();
    }

    function drawPilotCard(character, x, y, w, h, selected) {
      ctx.save();
      ctx.fillStyle = selected ? "rgba(156, 255, 109, 0.14)" : "rgba(5, 12, 6, 0.88)";
      ctx.strokeStyle = selected ? "#9cff6d" : "rgba(156, 255, 109, 0.42)";
      ctx.lineWidth = selected ? 3 : 2;
      ctx.shadowColor = selected ? "rgba(156, 255, 109, 0.42)" : "transparent";
      ctx.shadowBlur = selected ? 18 : 0;
      roundRect(x, y, w, h, Math.min(7, w * 0.08, h * 0.12), true, true);
      ctx.shadowBlur = 0;

      const imageY = y + h * 0.30;
      const imageW = Math.min(w * 0.76, character.spriteW * 0.95, h * 0.82);
      drawCharacterImage(character, x + w / 2, imageY, imageW, Math.sin(state.time * 2.4) * 0.06, selected);

      ctx.textAlign = "center";
      ctx.fillStyle = selected ? "#ffffff" : "#9cff6d";
      const titleLines = character.titleLines || [character.name.toUpperCase()];
      const lineHeight = clamp(h * 0.13, 8, 12);
      const nameMax = clamp(h * 0.16, 10, 14);
      const titleStart = y + h - 27 - Math.max(0, titleLines.length - 1) * lineHeight;
      titleLines.forEach((line, index) => {
        fitMonoFont(line, nameMax, 6, w - 8);
        ctx.fillText(line, x + w / 2, titleStart + index * lineHeight);
      });

      ctx.fillStyle = selected ? "#ffc857" : "rgba(217, 255, 208, 0.68)";
      fitMonoFont(selected ? "READY" : "SELECT", clamp(h * 0.13, 8, 11), 6, w - 14);
      ctx.fillText(selected ? "READY" : "SELECT", x + w / 2, y + h - 8);
      ctx.restore();
    }

    function drawCoverImage(image, x, y, width, height, offsetX = 0, offsetY = 0, zoom = 1) {
      const imageRatio = image.naturalWidth / image.naturalHeight;
      const targetRatio = width / height;
      let drawW = width;
      let drawH = height;

      if (targetRatio > imageRatio) {
        drawH = width / imageRatio;
      } else {
        drawW = height * imageRatio;
      }

      drawW *= zoom;
      drawH *= zoom;

      const maxOffsetX = Math.max(0, (drawW - width) * 0.5);
      const maxOffsetY = Math.max(0, (drawH - height) * 0.5);
      const drawX = x + (width - drawW) * 0.5 + clamp(offsetX, -maxOffsetX, maxOffsetX);
      const drawY = y + (height - drawH) * 0.5 + clamp(offsetY, -maxOffsetY, maxOffsetY);
      ctx.drawImage(image, drawX, drawY, drawW, drawH);
    }

    function drawRuinsLayer(baseY, alpha, color, pace) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      const offset = (state.time * pace) % 180;
      for (let x = -220 - offset; x < state.width + 220; x += 180) {
        const h = 42 + ((x * 13) % 74);
        ctx.fillRect(x, baseY - h, 48, h);
        ctx.fillRect(x + 60, baseY - h * 0.65, 30, h * 0.65);
        ctx.fillRect(x + 100, baseY - h * 0.95, 18, h * 0.95);
      }
      ctx.restore();
    }

    function drawObstacles() {
      for (const obstacle of state.obstacles) {
        drawObstacleStack(obstacle.x, 0, obstacle.width, obstacle.gapTop, obstacle.topSprite, true, obstacle.stripe);
        drawObstacleStack(
          obstacle.x,
          obstacle.gapBottom,
          obstacle.width,
          state.height - obstacle.gapBottom,
          obstacle.bottomSprite,
          false,
          obstacle.stripe
        );
      }
    }

    function getObstacleSprite(index) {
      if (!obstacleSprites.length) {
        return null;
      }
      const normalized = ((index || 0) % obstacleSprites.length + obstacleSprites.length) % obstacleSprites.length;
      return obstacleSprites[normalized];
    }

    function drawObstacleStack(x, y, w, h, spriteIndex, top, stripe) {
      const sprite = getObstacleSprite(spriteIndex);
      if (!sprite || !sprite.complete || !sprite.naturalWidth) {
        drawPipe(x, y, w, h, top, stripe);
        return;
      }

      ctx.save();
      ctx.beginPath();
      ctx.rect(x - 12, y, w + 24, h);
      ctx.clip();

      const drawW = w + 20;
      const naturalSegmentH = drawW * (sprite.naturalHeight / sprite.naturalWidth);
      const segmentH = clamp(naturalSegmentH, 96, Math.max(108, state.height * 0.34));
      const overlap = Math.max(18, segmentH * 0.24);
      const step = Math.max(34, segmentH - overlap);
      const drawX = x - 10 + (obstacleSpriteOffsets[spriteIndex] || 0);
      if (top) {
        for (let yy = y + h - segmentH; yy > y - segmentH - step; yy -= step) {
          drawObstacleSprite(sprite, drawX, yy, drawW, segmentH);
        }
      } else {
        for (let yy = y; yy < y + h + step; yy += step) {
          drawObstacleSprite(sprite, drawX, yy, drawW, segmentH);
        }
      }

      ctx.restore();
    }

    function drawObstacleSprite(sprite, x, y, w, h) {
      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
      ctx.shadowBlur = 6;
      ctx.shadowOffsetY = 2;
      ctx.drawImage(sprite, x, y, w, h);
      ctx.restore();
    }

    function drawPipe(x, y, w, h, top, stripe) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x - 10, y, w + 20, h);
      ctx.clip();

      const segmentH = 76;
      if (top) {
        for (let yy = y + h - segmentH; yy > y - segmentH; yy -= segmentH) {
          drawBarrelSegment(x - 4, yy, w + 8, segmentH + 2, stripe);
        }
      } else {
        for (let yy = y; yy < y + h; yy += segmentH) {
          drawBarrelSegment(x - 4, yy, w + 8, segmentH + 2, stripe);
        }
      }

      ctx.restore();
    }

    function drawBarrelSegment(x, y, w, h, stripe) {
      const body = ctx.createLinearGradient(x, 0, x + w, 0);
      body.addColorStop(0, "#7d7818");
      body.addColorStop(0.22, "#d4c621");
      body.addColorStop(0.5, "#9a931d");
      body.addColorStop(0.78, "#d0be1e");
      body.addColorStop(1, "#625d16");
      ctx.fillStyle = body;
      ctx.strokeStyle = "#392f16";
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 8, true, true);

      ctx.fillStyle = "rgba(64, 43, 15, 0.42)";
      ctx.fillRect(x + 5, y + 8, w - 10, 5);
      ctx.fillRect(x + 5, y + h - 13, w - 10, 5);

      ctx.strokeStyle = "rgba(39, 31, 12, 0.64)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 6, y + 16);
      ctx.lineTo(x + w - 6, y + 16);
      ctx.moveTo(x + 6, y + h - 18);
      ctx.lineTo(x + w - 6, y + h - 18);
      ctx.stroke();

      ctx.fillStyle = "rgba(80, 35, 13, 0.5)";
      for (let i = 0; i < 8; i += 1) {
        const rustX = x + 8 + ((i * 23 + stripe * 9) % Math.max(12, w - 16));
        const rustY = y + 16 + ((i * 17) % Math.max(12, h - 36));
        ctx.fillRect(rustX, rustY, 4 + (i % 3), 2 + (i % 2));
      }

      drawRadiationMark(x + w * 0.5, y + h * 0.52, Math.min(w, h) * 0.2);
    }

    function drawRadiationMark(cx, cy, r) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = "#2a2110";
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
      ctx.fill();
      for (let i = 0; i < 3; i += 1) {
        ctx.rotate((Math.PI * 2) / 3);
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.34);
        ctx.arc(0, 0, r, -Math.PI * 0.42, -Math.PI * 0.08);
        ctx.lineTo(0, -r * 0.32);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawCaps() {
      for (const cap of state.caps) {
        ctx.save();
        ctx.translate(cap.x, cap.y);
        const sprite = coinSprites[cap.sprite];
        const flip = Math.cos(cap.spin);
        const widthScale = 0.16 + Math.abs(flip) * 0.84;
        ctx.scale(widthScale * Math.sign(flip || 1), 1);
        if (sprite && sprite.complete && sprite.naturalWidth) {
          const size = cap.r * 3;
          ctx.shadowColor = "rgba(255, 232, 138, 0.42)";
          ctx.shadowBlur = 10;
          ctx.drawImage(sprite, -size * 0.5, -size * 0.5, size, size);
          ctx.shadowBlur = 0;
          drawCapShine(size, cap.spin);
        } else {
          drawFallbackCap(cap.r);
        }
        ctx.restore();
      }
    }

    function drawCapShine(size, spin) {
      const sweep = Math.sin(spin) * size * 0.18;
      const shine = ctx.createLinearGradient(-size * 0.5 + sweep, -size * 0.45, size * 0.28 + sweep, size * 0.36);
      shine.addColorStop(0, "rgba(255, 255, 255, 0)");
      shine.addColorStop(0.48, "rgba(255, 255, 210, 0.3)");
      shine.addColorStop(1, "rgba(255, 255, 255, 0)");
      ctx.globalCompositeOperation = "screen";
      ctx.fillStyle = shine;
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.46, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }

    function drawFallbackCap(radius) {
      ctx.fillStyle = "#b9802d";
      ctx.strokeStyle = "#ffe08a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(255, 255, 255, 0.34)";
      ctx.fillRect(-2, -radius + 3, 4, radius * 2 - 6);
    }

    function drawCharacterImage(character, x, y, spriteW, rotation, glowing) {
      const image = character.image;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      if (image.complete && image.naturalWidth) {
        const spriteH = spriteW * (image.naturalHeight / image.naturalWidth);
        ctx.shadowColor = glowing ? "rgba(156, 255, 109, 0.45)" : "rgba(156, 255, 109, 0.24)";
        ctx.shadowBlur = glowing ? 14 : 8;
        ctx.drawImage(image, -spriteW * 0.5, -spriteH * 0.5, spriteW, spriteH);
        ctx.shadowBlur = 0;
      } else {
        drawFallbackPlayer(state.player);
      }

      ctx.restore();
    }

    function drawPlayer() {
      const p = state.player;
      const character = characters[state.selectedCharacter] || characters[0];
      if (character.image.complete && character.image.naturalWidth) {
        const cached = getGameplaySpriteCache(character);
        if (cached) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.drawImage(cached.source, -cached.width * 0.5, -cached.height * 0.5, cached.width, cached.height);
          ctx.restore();
          return;
        }
        drawCharacterImage(character, p.x, p.y, gameplaySpriteWidth(character), p.rotation, true);
        return;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      drawFallbackPlayer(p);
      ctx.restore();
    }

    function gameplaySpriteWidth(character) {
      const image = character.image;
      const baseW = Math.min(character.spriteW, GAMEPLAY_SPRITE_MAX_W);
      if (!image.complete || !image.naturalWidth || !image.naturalHeight) {
        return baseW;
      }
      const ratio = image.naturalHeight / image.naturalWidth;
      return Math.min(baseW, GAMEPLAY_SPRITE_MAX_H / ratio);
    }

    function drawFallbackPlayer(p) {
      ctx.fillStyle = "#1f2b1d";
      ctx.strokeStyle = "#9cff6d";
      ctx.lineWidth = 3;
      roundRect(-24, -30, 56, 58, 8, true, true);

      ctx.fillStyle = "#0c190e";
      roundRect(-14, -20, 35, 28, 4, true, true);
      ctx.fillStyle = "#9cff6d";
      ctx.font = "700 9px Courier New";
      ctx.textAlign = "center";
      ctx.fillText("STAT", 4, -4);

      ctx.fillStyle = "#ffc857";
      ctx.beginPath();
      ctx.arc(20, 18, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#4b5a39";
      roundRect(-43, -18, 18, 36, 5, true, true);
      ctx.fillStyle = "#6f7f56";
      roundRect(-56, -10, 15, 20, 4, true, true);

      const flame = state.phase === "running" && (p.vy < -80 || Math.sin(state.time * 24) > 0);
      if (flame) {
        const flameSize = 24 + Math.sin(state.time * 32) * 6;
        ctx.fillStyle = "#ffc857";
        ctx.beginPath();
        ctx.moveTo(-55, 0);
        ctx.lineTo(-55 - flameSize, -12);
        ctx.lineTo(-55 - flameSize * 0.7, 0);
        ctx.lineTo(-55 - flameSize, 12);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ff5d4d";
        ctx.beginPath();
        ctx.moveTo(-55, 0);
        ctx.lineTo(-55 - flameSize * 0.58, -7);
        ctx.lineTo(-55 - flameSize * 0.42, 0);
        ctx.lineTo(-55 - flameSize * 0.58, 7);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const particle of state.particles) {
        const alpha = clamp(particle.life / particle.maxLife, 0, 1);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawHudOverlay() {
      if (isMobileCabinet()) {
        return;
      }
      ctx.strokeStyle = "rgba(156, 255, 109, 0.34)";
      ctx.lineWidth = 2;
      ctx.strokeRect(16, 16, state.width - 32, state.height - 74);

      ctx.fillStyle = "rgba(156, 255, 109, 0.86)";
      ctx.font = "700 18px Courier New";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE ${state.score}`, 28, 44);
      ctx.textAlign = "right";
      ctx.fillText(`BEST ${Math.max(state.best, state.score)}`, state.width - 28, 44);
      drawChargeMeter();
    }

    function drawChargeMeter() {
      const meterW = clamp(state.width * 0.42, 132, 250);
      const meterH = meterW * (113 / 556);
      const x = (state.width - meterW) / 2;
      const y = 24;
      const charge = clamp(state.player.charge, 0, 1);

      ctx.save();
      ctx.textAlign = "center";
      ctx.font = "700 10px Courier New";
      ctx.fillStyle = "rgba(217, 255, 208, 0.74)";
      ctx.fillText("CORE CHARGE", state.width / 2, y - 8);

      if (coreChargerImage.complete && coreChargerImage.naturalWidth) {
        ctx.drawImage(coreChargerImage, x, y, meterW, meterH);

        const fillX = x + meterW * 0.1;
        const fillY = y + meterH * 0.26;
        const fillW = Math.max(0, meterW * 0.77 * charge);
        const fillH = meterH * 0.26;
        const fill = ctx.createLinearGradient(fillX, 0, fillX + meterW * 0.77, 0);
        fill.addColorStop(0, "#ff5d4d");
        fill.addColorStop(0.48, "#ffc857");
        fill.addColorStop(1, "#9cff6d");
        ctx.globalAlpha = 0.82;
        ctx.fillStyle = fill;
        roundRect(fillX, fillY, fillW, fillH, 2, true, false);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = "rgba(5, 12, 6, 0.72)";
        ctx.strokeStyle = charge < BOOST_COST ? "rgba(255, 93, 77, 0.82)" : "rgba(156, 255, 109, 0.62)";
        ctx.lineWidth = 2;
        roundRect(x, y, meterW, 12, 3, true, true);

        const fillW = Math.max(0, (meterW - 4) * charge);
        const fill = ctx.createLinearGradient(x, 0, x + meterW, 0);
        fill.addColorStop(0, "#ff5d4d");
        fill.addColorStop(0.48, "#ffc857");
        fill.addColorStop(1, "#9cff6d");
        ctx.fillStyle = fill;
        roundRect(x + 2, y + 2, fillW, 8, 2, true, false);
      }

      ctx.fillStyle = charge < BOOST_COST ? "#ff8a78" : "#9cff6d";
      ctx.font = "700 10px Courier New";
      ctx.fillText(`${Math.round(charge * 100)}%`, state.width / 2, y + meterH + 12);

      const capProgress = state.capsCollected % CAP_MILESTONE;
      ctx.fillStyle = "rgba(255, 200, 87, 0.86)";
      ctx.fillText(`CAPS ${capProgress}/${CAP_MILESTONE}`, state.width / 2, y + meterH + 25);
      ctx.restore();
    }

    function drawMessage(title, detail) {
      const boxW = clamp(state.width * 0.62, 270, 540);
      const boxH = 138;
      const x = (state.width - boxW) / 2;
      const y = (state.height - boxH) / 2;

      ctx.fillStyle = "rgba(5, 12, 6, 0.94)";
      ctx.strokeStyle = "rgba(156, 255, 109, 0.7)";
      ctx.lineWidth = 2;
      roundRect(x, y, boxW, boxH, 6, true, true);

      ctx.fillStyle = "#9cff6d";
      ctx.textAlign = "center";
      fitMonoFont(title, 28, 18, boxW - 30);
      ctx.fillText(title, state.width / 2, y + 54);
      ctx.fillStyle = "rgba(217, 255, 208, 0.78)";
      fitMonoFont(detail, 15, 11, boxW - 28);
      ctx.fillText(detail, state.width / 2, y + 92);
    }

    function drawGameOverScreen() {
      ctx.save();
      if (gameOverImage.complete && gameOverImage.naturalWidth) {
        drawCoverImage(gameOverImage, 0, 0, state.width, state.height);
      } else {
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, state.width, state.height);
      }

      ctx.fillStyle = "rgba(0, 0, 0, 0.36)";
      ctx.fillRect(0, 0, state.width, state.height);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      fitMonoFont("GAME OVER", 82, 42, state.width - 52);
      ctx.lineWidth = 8;
      ctx.strokeStyle = "rgba(0, 0, 0, 0.82)";
      ctx.strokeText("GAME OVER", state.width / 2, state.height * 0.5);
      ctx.fillStyle = "#ff1d1d";
      ctx.shadowColor = "rgba(255, 0, 0, 0.8)";
      ctx.shadowBlur = 18;
      ctx.fillText("GAME OVER", state.width / 2, state.height * 0.5);
      ctx.restore();
    }

    function drawLeaderboardPanel(options = {}) {
      const viewer = Boolean(options.viewer);
      const board = state.leaderboard;
      const boxW = clamp(state.width * 0.78, 300, 610);
      const boxH = clamp(state.height * 0.74, 258, 390);
      const x = (state.width - boxW) / 2;
      const y = (state.height - boxH) / 2;
      const pad = clamp(boxW * 0.055, 14, 24);
      const buttonH = clamp(boxH * 0.105, 30, 40);
      const inputH = buttonH;
      const bottomY = y + boxH - pad;
      const inputW = clamp(boxW * 0.28, 78, 126);
      const buttonW = clamp(boxW * 0.24, 78, 116);
      const inputX = x + pad;
      const submitX = inputX + inputW + 8;
      const restartX = x + boxW - pad - buttonW;
      const controlsY = bottomY - buttonH;
      const rowsTop = y + pad + 96;
      const statusY = controlsY - 12;
      const rowsBottom = statusY - 18;
      const rowH = clamp((rowsBottom - rowsTop) / LEADERBOARD_LIMIT, 16, 33);

      board.inputRect = viewer ? null : { x: inputX, y: controlsY, w: inputW, h: inputH };
      board.submitRect = viewer || board.submitted ? null : { x: submitX, y: controlsY, w: buttonW, h: buttonH };
      board.restartRect = viewer ? null : { x: restartX, y: controlsY, w: buttonW, h: buttonH };
      board.backRect = viewer ? { x: state.width / 2 - buttonW / 2, y: controlsY, w: buttonW, h: buttonH } : null;

      ctx.save();
      ctx.fillStyle = "rgba(5, 12, 6, 0.95)";
      ctx.strokeStyle = "rgba(156, 255, 109, 0.72)";
      ctx.lineWidth = 2;
      roundRect(x, y, boxW, boxH, 8, true, true);

      ctx.textAlign = "center";
      ctx.fillStyle = "#9cff6d";
      const title = viewer ? "LIVE TOP 5" : "DAILY TOP 5";
      fitMonoFont(title, 28, 18, boxW - pad * 2);
      ctx.fillText(title, state.width / 2, y + pad + 24);
      ctx.fillStyle = "rgba(217, 255, 208, 0.76)";
      const boardDateLabel = displayBoardDate(board.dateKey || todayBoardKey());
      const dateLine = viewer ? `UTC ${boardDateLabel}` : `UTC ${boardDateLabel}   SCORE ${state.score}`;
      fitMonoFont(dateLine, 14, 9, boxW - pad * 2);
      ctx.fillText(dateLine, state.width / 2, y + pad + 48);
      ctx.fillStyle = "#ffc857";
      const resetText = `RESETS IN ${leaderboardResetCountdown()}`;
      fitMonoFont(resetText, 16, 9, boxW - pad * 2);
      ctx.fillText(resetText, state.width / 2, y + pad + 70);

      ctx.textAlign = "left";
      const entries = board.loading ? [] : board.entries;
      for (let i = 0; i < LEADERBOARD_LIMIT; i += 1) {
        const rowY = rowsTop + i * rowH;
        ctx.fillStyle = i % 2 ? "rgba(156, 255, 109, 0.055)" : "rgba(156, 255, 109, 0.1)";
        roundRect(x + pad, rowY - 15, boxW - pad * 2, Math.max(14, rowH - 3), 4, true, false);
        const entry = entries[i];
        ctx.fillStyle = entry ? "#d9ffd0" : "rgba(217, 255, 208, 0.36)";
        fitMonoFont(entry ? `${i + 1}. ${entry.initials}` : `${i + 1}. ---`, 16, 9, boxW * 0.42);
        ctx.fillText(entry ? `${i + 1}. ${entry.initials}` : `${i + 1}. ---`, x + pad + 10, rowY);
        ctx.textAlign = "right";
        fitMonoFont(entry ? String(entry.score) : "--", 16, 9, boxW * 0.2);
        ctx.fillText(entry ? String(entry.score) : "--", x + boxW - pad - 10, rowY);
        ctx.textAlign = "left";
      }

      const status = board.loading ? "Loading..." : board.status;
      ctx.fillStyle = status.includes("Firebase") || status.includes("unavailable") || status.includes("failed") ? "#ffc857" : "rgba(217, 255, 208, 0.78)";
      ctx.textAlign = "center";
      fitMonoFont(status, 12, 8, boxW - pad * 2);
      ctx.fillText(status, state.width / 2, statusY);

      ctx.textAlign = "center";
      if (viewer) {
        ctx.fillStyle = "rgba(255, 200, 87, 0.1)";
        ctx.strokeStyle = "rgba(255, 200, 87, 0.68)";
        roundRect(board.backRect.x, board.backRect.y, board.backRect.w, board.backRect.h, 5, true, true);
        ctx.fillStyle = "#ffc857";
        fitMonoFont("BACK", 13, 8, board.backRect.w - 10);
        ctx.fillText("BACK", board.backRect.x + board.backRect.w / 2, board.backRect.y + board.backRect.h * 0.66);
      } else {
        ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
        ctx.strokeStyle = "rgba(156, 255, 109, 0.56)";
        roundRect(inputX, controlsY, inputW, inputH, 5, true, true);
        ctx.fillStyle = "#9cff6d";
        fitMonoFont(board.initials || "INITIALS", 14, 8, inputW - 10);
        ctx.fillText(board.initials || "INITIALS", inputX + inputW / 2, controlsY + inputH * 0.66);

        if (!board.submitted) {
          ctx.fillStyle = "rgba(156, 255, 109, 0.12)";
          ctx.strokeStyle = "rgba(156, 255, 109, 0.64)";
          roundRect(submitX, controlsY, buttonW, buttonH, 5, true, true);
          ctx.fillStyle = "#9cff6d";
          fitMonoFont("SUBMIT", 13, 8, buttonW - 10);
          ctx.fillText("SUBMIT", submitX + buttonW / 2, controlsY + buttonH * 0.66);
        } else {
          ctx.fillStyle = "#ffc857";
          fitMonoFont("SUBMITTED", 12, 8, buttonW + 10);
          ctx.fillText("SUBMITTED", submitX + buttonW / 2, controlsY + buttonH * 0.66);
        }

        ctx.fillStyle = "rgba(255, 200, 87, 0.1)";
        ctx.strokeStyle = "rgba(255, 200, 87, 0.68)";
        roundRect(restartX, controlsY, buttonW, buttonH, 5, true, true);
        ctx.fillStyle = "#ffc857";
        fitMonoFont("RESTART", 13, 8, buttonW - 10);
        ctx.fillText("RESTART", restartX + buttonW / 2, controlsY + buttonH * 0.66);
      }
      ctx.restore();
    }

    function fitMonoFont(text, maxPx, minPx, maxWidth) {
      let size = maxPx;
      do {
        ctx.font = `700 ${size}px Courier New`;
        if (ctx.measureText(text).width <= maxWidth || size <= minPx) {
          return;
        }
        size -= 1;
      } while (size >= minPx);
    }

    function roundRect(x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function loop(now) {
      const dt = Math.min(0.033, (now - state.last) / 1000 || 0);
      state.last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function useControl(event, action) {
      event.preventDefault();
      event.stopPropagation();
      unlockAudio();
      action();
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const localX = event.clientX - rect.left;
      const localY = event.clientY - rect.top;
      if (usesFixedWorld()) {
        return {
          x: (localX - state.viewport.x) / state.viewport.scale,
          y: (localY - state.viewport.y) / state.viewport.scale
        };
      }
      return {
        x: localX,
        y: localY
      };
    }

    function isSelectSwipePointer(event) {
      return event.pointerType === "touch" || event.pointerType === "pen";
    }

    function promptForInitials() {
      const typed = window.prompt("Enter initials for the daily Top 5:", state.leaderboard.initials || "");
      if (typed !== null) {
        state.leaderboard.initials = cleanInitials(typed);
      }
    }

    function handleLeaderboardPointer(point) {
      const board = state.leaderboard;
      if (pointInRect(point, board.inputRect)) {
        promptForInitials();
        return true;
      }
      if (pointInRect(point, board.submitRect)) {
        submitLeaderboardScore();
        return true;
      }
      if (pointInRect(point, board.restartRect)) {
        resetGame();
        return true;
      }
      return true;
    }

    function handleScoreboardViewerPointer(point) {
      if (pointInRect(point, state.leaderboard.backRect)) {
        showCharacterSelect();
        return true;
      }
      return true;
    }

    function handleModePointer(point) {
      const hit = state.modeButtonRects.find((rect) => pointInRect(point, rect));
      if (!hit) {
        return;
      }
      chooseGameMode(hit.mode);
    }

    function handleSelectPointer(point, now = performance.now()) {
      if (pointInRect(point, state.changeModeButtonRect)) {
        showModeSelect();
        return;
      }

      if (pointInRect(point, state.scoreboardButtonRect)) {
        showScoreboardViewer();
        return;
      }

      const pageHit = state.pageButtonRects.find((rect) => pointInRect(point, rect));
      if (pageHit) {
        showCharacterPage(state.characterPage + pageHit.direction);
        playTone("select");
        return;
      }

      const hit = state.selectionRects.find((rect) => (
        point.x >= rect.x &&
        point.x <= rect.x + rect.w &&
        point.y >= rect.y &&
        point.y <= rect.y + rect.h
      ));
      if (!hit) {
        resetSelectTapTracker();
        return;
      }

      const isDoubleActivate = (
        hit.index === state.selectedCharacter &&
        hit.index === state.lastSelectTapIndex &&
        now - state.lastSelectTapTime <= SELECT_DOUBLE_ACTIVATE_MS
      );

      if (isDoubleActivate) {
        chooseCharacter(hit.index);
        resetGame();
        return;
      }

      state.selectedCharacter = hit.index;
      state.lastSelectTapIndex = hit.index;
      state.lastSelectTapTime = now;
      playTone("select");
      updateHud();
    }

    function handleCanvasPointer(event) {
      if (state.phase === "select" && isSelectSwipePointer(event)) {
        useControl(event, () => {
          state.selectSwipe = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            startTime: performance.now()
          };
          if (canvas.setPointerCapture) {
            canvas.setPointerCapture(event.pointerId);
          }
        });
        return;
      }

      useControl(event, () => {
        const point = canvasPoint(event);
        if (state.phase === "intro") {
          showModeSelect();
          return;
        }
        if (state.phase === "mode") {
          handleModePointer(point);
          return;
        }
        if (state.phase === "select") {
          handleSelectPointer(point);
          return;
        }
        if (state.phase === "scoreboard") {
          handleScoreboardViewerPointer(point);
          return;
        }
        if (state.phase === "over" && state.gameOverTimer <= 0) {
          handleLeaderboardPointer(point);
          return;
        }
        thrust();
      });
    }

    function handleCanvasPointerUp(event) {
      if (!state.selectSwipe || event.pointerId !== state.selectSwipe.pointerId) {
        return;
      }
      useControl(event, () => {
        const swipe = state.selectSwipe;
        state.selectSwipe = null;
        if (canvas.releasePointerCapture) {
          try {
            canvas.releasePointerCapture(event.pointerId);
          } catch (error) {
            // Ignore release failures from browsers that already cleared capture.
          }
        }

        if (state.phase !== "select") {
          return;
        }

        const dx = event.clientX - swipe.startX;
        const dy = event.clientY - swipe.startY;
        const horizontal = Math.abs(dx);
        const vertical = Math.abs(dy);
        if (horizontal >= SELECT_SWIPE_MIN_PX && horizontal > vertical * 1.35) {
          showCharacterPage(state.characterPage + (dx < 0 ? 1 : -1));
          playTone("select");
          return;
        }

        handleSelectPointer(canvasPoint(event), performance.now());
      });
    }

    function cancelSelectSwipe(event) {
      if (!state.selectSwipe || event.pointerId !== state.selectSwipe.pointerId) {
        return;
      }
      state.selectSwipe = null;
      resetSelectTapTracker();
    }

    function cycleCharacter(direction) {
      if (state.phase !== "select") {
        return;
      }
      const next = (state.selectedCharacter + direction + characters.length) % characters.length;
      state.selectedCharacter = next;
      state.characterPage = pageForCharacter(next);
      resetSelectTapTracker();
      playTone("select");
      updateHud();
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", () => {
      syncViewportHeight();
      window.setTimeout(resizeCanvas, 250);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resizeCanvas);
      window.visualViewport.addEventListener("scroll", resizeCanvas);
    }
    document.addEventListener("pointerdown", unlockAudio, { capture: true, passive: true });
    document.addEventListener("touchend", unlockAudio, { capture: true, passive: true });
    document.addEventListener("touchmove", (event) => event.preventDefault(), { passive: false });
    document.addEventListener("contextmenu", (event) => event.preventDefault());
    window.addEventListener("keydown", (event) => {
      unlockAudio();
      if (state.phase === "intro" && (event.code === "Enter" || event.code === "Space")) {
        event.preventDefault();
        showModeSelect();
        return;
      }
      if (state.phase === "mode") {
        if (event.code === "ArrowLeft" || event.code === "ArrowRight") {
          event.preventDefault();
          state.modeFocus = state.modeFocus === "easy" ? "hard" : "easy";
          playTone("select");
          updateHud();
          return;
        }
        if (event.code === "Enter" || event.code === "Space") {
          event.preventDefault();
          chooseGameMode(state.modeFocus);
          return;
        }
        if (event.code === "Escape" || event.code === "Backspace") {
          event.preventDefault();
          state.phase = "intro";
          updateHud();
          return;
        }
        return;
      }
      if (state.phase === "over" && state.gameOverTimer <= 0) {
        if (event.code === "Enter") {
          event.preventDefault();
          submitLeaderboardScore();
          return;
        }
        if (event.code === "Backspace") {
          event.preventDefault();
          state.leaderboard.initials = state.leaderboard.initials.slice(0, -1);
          return;
        }
        if (/^[a-z0-9]$/i.test(event.key) && state.leaderboard.initials.length < 10) {
          event.preventDefault();
          state.leaderboard.initials = cleanInitials(state.leaderboard.initials + event.key);
          return;
        }
      }
      if (state.phase === "scoreboard" && (event.code === "Escape" || event.code === "Backspace")) {
        event.preventDefault();
        showCharacterSelect();
        return;
      }
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        thrust();
      }
      if (event.code === "ArrowLeft") {
        event.preventDefault();
        cycleCharacter(-1);
      }
      if (event.code === "ArrowRight") {
        event.preventDefault();
        cycleCharacter(1);
      }
      if (event.code === "KeyP") {
        togglePause();
      }
      if (event.code === "Enter" && state.phase !== "running") {
        resetGame();
      }
    });
    canvas.addEventListener("pointerdown", handleCanvasPointer, { passive: false });
    canvas.addEventListener("pointerup", handleCanvasPointerUp, { passive: false });
    canvas.addEventListener("pointercancel", cancelSelectSwipe, { passive: false });
    startButton.addEventListener("click", (event) => useControl(event, resetGame));
    pauseButton.addEventListener("click", (event) => useControl(event, togglePause));
    soundButton.addEventListener("click", (event) => useControl(event, toggleSound));
    statControl.addEventListener("click", (event) => useControl(event, statControlAction));
    dataControl.addEventListener("click", (event) => useControl(event, togglePause));
    radioControl.addEventListener("click", (event) => useControl(event, radioControlAction));
    mobileRestartButton.addEventListener("pointerdown", (event) => useControl(event, resetGame), { passive: false });
    mobileBoostButton.addEventListener("pointerdown", (event) => useControl(event, thrust), { passive: false });
    mobilePauseButton.addEventListener("pointerdown", (event) => useControl(event, togglePause), { passive: false });

    syncViewportHeight();
    resizeCanvas();
    updateHud();
    requestAnimationFrame((now) => {
      state.last = now;
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
